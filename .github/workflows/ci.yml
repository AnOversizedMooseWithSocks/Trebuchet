name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baseline:
        description: Generate canonical Linux visual baselines as an artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      # public/app.js is a generated artifact: build-app-js.mjs concatenates
      # public/modules/* (the modules now tile app.js exactly). Rebuild it and
      # fail if the committed copy differs from a fresh build. Catches editing
      # app.js directly (lost on next build) and editing a module without
      # rebuilding (a stale bundle would ship).
      - name: Verify app.js is in sync with modules
        run: |
          npm run build:js
          git diff --exit-code -- public/app.js \
            || (echo '::error::public/app.js is out of sync with public/modules/*. Run "npm run build:js" and commit the result.' && exit 1)

      # Guards against the recurring bug where a new module is imported but
      # not added to package.json's "files"/"build.files". It works in dev
      # (runs from source) but is silently missing from the packaged Electron
      # app. The script computes the runtime import closure from main.js and
      # fails if any reachable file isn't listed in both arrays.
      - name: Verify package.json file lists cover all runtime modules
        run: npm run check:package

      - name: Unit tests
        run: npm test

      - name: CLI contract and binary smoke
        run: |
          npm run test:cli
          npm run cli -- doctor --json

      # Smoke tests exercise live RPC and Raydium API dependencies read-only.
      # No transactions are sent.  Requires the SMOKE_TEST_RPC repository
      # secret.  When the secret is unset (e.g. on forks), the test harness
      # skips itself gracefully and this step passes.
      - name: Smoke tests (read-only mainnet)
        continue-on-error: true
        env:
          TREBUCHET_SMOKE_TEST_RPC: ${{ secrets.SMOKE_TEST_RPC }}
        run: node --test test/smoke-launch.test.mjs

      - name: Blocking dependency audit policy
        run: npm run check:audit

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            smoke_command: npm exec electron-builder -- --mac --arm64 --dir --publish=never
            artifact: trebuchet-macos-arm64
          - name: Windows
            os: windows-latest
            smoke_command: npm exec electron-builder -- --win --dir --publish=never
            artifact: trebuchet-windows
          - name: Linux
            os: ubuntu-latest
            smoke_command: npm exec electron-builder -- --linux --dir --publish=never
            artifact: trebuchet-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Restore Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-cache-${{ runner.os }}-${{ matrix.artifact }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-${{ matrix.artifact }}-

      - name: Install dependencies
        run: npm ci

      - name: Build vanity keygen binary
        # Same rationale as release.yml: c/build/ is gitignored, the
        # asarUnpack pattern packages whatever's in it, so the smoke
        # build needs the binary present or it silently produces a
        # vanity-less package. Catching that here prevents a regression
        # from sliding all the way to a release.
        shell: bash
        run: npm run build:c

      - name: Build package smoke
        run: ${{ matrix.smoke_command }}

      - name: Run packaged v2 Electron smoke
        if: matrix.artifact == 'trebuchet-linux'
        run: xvfb-run -a npm run test:electron:v2:packaged

  e2e:
    name: E2E UI Flows
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      env:
        LANG: C.UTF-8
        TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Classic E2E tests
        if: ${{ !inputs.update_visual_baseline }}
        run: node test/e2e/ui-flows.mjs 01 02 03 04 05 06 07 08 09 --mobile

      - name: Run v2 API-backed E2E test
        if: ${{ !inputs.update_visual_baseline }}
        run: npm run test:e2e:v2

      - name: Run v2 desktop and mobile viewport smoke
        if: ${{ !inputs.update_visual_baseline }}
        run: npm run test:v2:viewport

      - name: Visual regression test
        if: ${{ !inputs.update_visual_baseline }}
        run: npm run test:visual

      - name: Generate canonical Linux visual baselines
        if: ${{ inputs.update_visual_baseline }}
        run: npm run test:visual:golden:linux

      - name: Upload canonical Linux visual baselines
        if: ${{ inputs.update_visual_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-golden-linux
          path: test/ui/golden-linux
          if-no-files-found: error

      - name: Upload visual diff artifacts
        if: ${{ failure() && !inputs.update_visual_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            test/ui/diffs
            test/ui/actual
          if-no-files-found: ignore

      - name: Convert videos to GIF
        if: always()
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq ffmpeg
          fi
          for f in test/e2e/videos/*.webm; do
            [ -s "$f" ] || { echo "::warning::Skipping empty video $f"; continue; }
            name="${f%.webm}"
            timeout 60s ffmpeg -y -i "$f" -vf "fps=6,scale=640:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" -loop 0 "${name}.gif" 2>/dev/null \
              || echo "::warning::Could not convert $f to GIF"
          done

      - name: Build tutorial page
        if: always()
        run: |
          mkdir -p _tutorial
          cp test/e2e/videos/*.gif _tutorial/ 2>/dev/null || true
          cp test/e2e/tutorial.html _tutorial/index.html

      - name: Upload tutorial artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-walkthrough
          path: _tutorial
          if-no-files-found: ignore
